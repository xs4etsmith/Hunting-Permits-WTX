<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bird Hunt Permit Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          forest: {
            950: '#101D10', 900: '#1C2D1C', 800: '#243824',
            700: '#2E4A2D', 600: '#3D6337', 500: '#4E7A44',
            400: '#6A9E5E', 300: '#92C089', 200: '#BFDBBA',
            100: '#E5F0E2', 50: '#F3F8F1',
          }
        },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
      }
    }
  };
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #EAE7DF; min-height: 100vh; margin: 0; }

  input, textarea { font-family: inherit; outline: none; }
  input:focus, textarea:focus {
    border-color: #4E7A44 !important;
    box-shadow: 0 0 0 3px rgba(78,122,68,0.13);
  }

  .tab-btn { padding: 5px 14px; border-radius: 6px; font-size: 13.5px; font-weight: 500; cursor: pointer; border: none; background: transparent; transition: background 0.14s, color 0.14s; }
  .tab-active { background: rgba(255,255,255,0.16); color: #fff; }
  .tab-inactive { color: #92C089; }
  .tab-inactive:hover { background: rgba(255,255,255,0.08); color: #fff; }

  .btn-forest { background: #1C2D1C; color: #fff; border: none; cursor: pointer; font-family: inherit; transition: background 0.14s, box-shadow 0.14s, transform 0.1s; }
  .btn-forest:hover { background: #243824; box-shadow: 0 4px 14px rgba(28,45,28,0.28); }
  .btn-forest:active { transform: scale(0.98); }

  .btn-outline { background: #fff; color: #374151; border: 1.5px solid #D1D5DB; cursor: pointer; font-family: inherit; transition: border-color 0.14s, background 0.14s; }
  .btn-outline:hover { border-color: #9CA3AF; background: #F9FAFB; }

  .coord-card { background: #F5FBF3; border: 1px solid #CEEAC8; border-radius: 10px; }
  .action-btn { width: 30px; height: 30px; border-radius: 6px; border: none; cursor: pointer; background: transparent; display: flex; align-items: center; justify-content: center; transition: background 0.12s, color 0.12s; }

  .permit-shadow { box-shadow: 0 2px 8px -2px rgba(28,45,28,0.10), 0 12px 36px -4px rgba(28,45,28,0.16); }

  @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(8px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
  .toast-el {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1C2D1C; color: #fff; padding: 10px 22px; border-radius: 12px;
    font-size: 13px; font-weight: 500; z-index: 9999; white-space: nowrap;
    animation: toastIn 0.18s ease; transition: opacity 0.3s;
  }

  @media print {
    .no-print { display: none !important; }
    body { background: #fff; }
    .permit-shadow { box-shadow: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
// ─── Firebase ─────────────────────────────────────────────
firebase.initializeApp({
  apiKey: "AIzaSyAOmr5uZaMBN0aduKg7k7wRCe0978BcbCo",
  authDomain: "hunting-permits-wtx.firebaseapp.com",
  projectId: "hunting-permits-wtx",
  storageBucket: "hunting-permits-wtx.firebasestorage.app",
  messagingSenderId: "418496930100",
  appId: "1:418496930100:web:f6c28111ebd208417a8561"
});
const firestore = firebase.firestore();
const COLL = 'permits';

// ─── Storage ───────────────────────────────────────────────
const db = {
  all: () => S.permits,
  find: (id) => S.permits.find(p => p.id === id),
  async upsert(p) { await firestore.collection(COLL).doc(p.id).set(p); },
  async del(id) { await firestore.collection(COLL).doc(id).delete(); },
};

// ─── Helpers ──────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function today() { return new Date().toISOString().split('T')[0]; }
function fmtDate(s) {
  if (!s) return '—';
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
function nextNum() {
  const yr = new Date().getFullYear();
  const n = db.all().filter(p => (p.permitNumber||'').includes(`-${yr}-`)).length + 1;
  return `BP-${yr}-${String(n).padStart(3,'0')}`;
}
function status(p) {
  if (p.deactivated) return 'Revoked';
  if (p.expiresDate && new Date(p.expiresDate + 'T23:59:59') < new Date()) return 'Expired';
  return 'Active';
}
function encode(p) { return btoa(unescape(encodeURIComponent(JSON.stringify(p)))); }
function decode(s) { try { return JSON.parse(decodeURIComponent(escape(atob(s)))); } catch { return null; } }
function makeLink(p) { return `${location.origin}${location.pathname}?v=${encode(p)}`; }

async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement('textarea'); t.value = text; Object.assign(t.style,{position:'fixed',opacity:0}); document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast(msg || 'Permit link copied to clipboard!');
}

function toast(msg, ms = 2800) {
  const el = document.createElement('div'); el.className = 'toast-el'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 310); }, ms);
}

// ─── Bird SVG ──────────────────────────────────────────────
function bird(sz = 44) {
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="21" cy="32" rx="14" ry="11" fill="#C47B36"/>
    <path d="M7 30 C3 23 5 15 8 12 C9 21 12 27 16 29Z" fill="#A85F20"/>
    <circle cx="34" cy="21" r="8.5" fill="#C47B36"/>
    <path d="M32 12.5 C31 6 33.5 3 33 0.5" stroke="#7A3D10" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <ellipse cx="32.5" cy="0.8" rx="2.6" ry="2" fill="#7A3D10"/>
    <circle cx="37.5" cy="19.5" r="2.5" fill="#0F1A0F"/>
    <circle cx="38.2" cy="18.7" r="0.9" fill="white"/>
    <path d="M42 21 L46.5 20.2 L42 22.4Z" fill="#7A3D10"/>
    <path d="M10 29 C16 20 26 22 30 26 C22 24 17 29 14 33Z" fill="#A85F20"/>
    <line x1="19" y1="42" x2="16" y2="50" stroke="#7A3D10" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="25" y1="42" x2="28" y2="50" stroke="#7A3D10" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M13 50 L17 50 M16 50 L16 47.5" stroke="#7A3D10" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M25 50 L29 50 M28 50 L28 47.5" stroke="#7A3D10" stroke-width="1.9" stroke-linecap="round"/>
  </svg>`;
}

// ─── State ────────────────────────────────────────────────
const S = {
  tab: 'new',
  editId: null,
  viewerPermit: null,
  f: null,
  permits: [],
  upload: { rows: null, results: null, generating: false, parseError: null },
};

function freshForm() {
  return { ranchName:'', permitNumber: nextNum(), holderName:'', email:'', issueDate: today(), expiresDate:'', species:'', coords:[{lat:'',lng:'',label:''}] };
}
S.f = freshForm();

// ─── Root render ──────────────────────────────────────────
function render() {
  const v = new URLSearchParams(location.search).get('v');
  if (v) { const p = decode(v); if (p) { renderCustomer(p); return; } }
  renderAdmin();
}

// ─── Admin shell ──────────────────────────────────────────
function renderAdmin() {
  document.getElementById('app').innerHTML = `
    <div>
      <header style="background:#1C2D1C" class="shadow-lg no-print">
        <div class="max-w-4xl mx-auto px-4 h-14 flex items-center gap-3">
          <div class="flex items-center gap-2.5 mr-1">${bird(32)}<span class="text-white font-semibold text-[15px] tracking-tight">Bird Hunt Permit Hub</span></div>
          <nav class="flex items-center gap-0.5">
            ${['new','issued','viewer','upload'].map((t,_,arr) => {
              const labels = {'new':'New permit','issued':'Issued permits','viewer':'Viewer','upload':'Bulk upload'};
              return `<button onclick="setTab('${t}')" class="tab-btn ${S.tab===t?'tab-active':'tab-inactive'}">${labels[t]}</button>`;
            }).join('')}
          </nav>
        </div>
      </header>
      <main class="max-w-4xl mx-auto px-4 py-8">
        ${S.tab==='new' ? tabNew() : S.tab==='issued' ? tabIssued() : S.tab==='viewer' ? tabViewer() : tabUpload()}
      </main>
    </div>`;
}

// ─── Tab: New Permit ──────────────────────────────────────
function tabNew() {
  const f = S.f;
  const editing = !!S.editId;

  const coordRows = f.coords.map((c,i) => `
    <div class="coord-card p-4 mb-3">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2.5">
          <span style="background:#1C2D1C" class="w-6 h-6 rounded-full text-white text-xs font-bold flex items-center justify-center flex-shrink-0">${i+1}</span>
          <span class="text-sm font-medium text-gray-700">Coordinate ${i+1}</span>
        </div>
        ${f.coords.length > 1 ? `<button onclick="rmCoord(${i})" class="text-gray-300 hover:text-red-400 text-xl leading-none transition-colors" title="Remove">&times;</button>` : ''}
      </div>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Latitude</label>
          <input type="text" value="${esc(c.lat)}" placeholder="e.g. 32.7157"
            oninput="updCoord(${i},'lat',this.value)"
            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Longitude</label>
          <input type="text" value="${esc(c.lng)}" placeholder="e.g. -97.3297"
            oninput="updCoord(${i},'lng',this.value)"
            class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white">
        </div>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Area label <span class="font-normal text-gray-400">(optional)</span></label>
        <input type="text" value="${esc(c.label)}" placeholder="e.g. North Pasture, East Field…"
          oninput="updCoord(${i},'label',this.value)"
          class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white">
      </div>
    </div>`).join('');

  return `
    ${editing ? `<div class="mb-4 flex items-center gap-2 text-sm text-forest-600">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
      <span>Editing permit <strong>${esc(f.permitNumber)}</strong></span>
      <button onclick="cancelEdit()" class="ml-2 text-xs text-gray-400 hover:text-gray-600 underline">Cancel</button>
    </div>` : ''}

    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 mb-4">
      <div class="flex items-center gap-2 mb-5">
        <svg class="w-3.5 h-3.5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Permit Details</span>
      </div>
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Ranch name <span class="text-red-400">*</span></label>
          <input id="fi-ranch" type="text" value="${esc(f.ranchName)}" placeholder="Rolling Plains Ranch"
            oninput="S.f.ranchName=this.value"
            class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg bg-white">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Permit number</label>
          <input id="fi-num" type="text" value="${esc(f.permitNumber)}" placeholder="BP-2026-001"
            oninput="S.f.permitNumber=this.value"
            class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg bg-white">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Permit holder name <span class="text-red-400">*</span></label>
          <input id="fi-holder" type="text" value="${esc(f.holderName)}" placeholder="John Smith"
            oninput="S.f.holderName=this.value"
            class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg bg-white">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email <span class="text-gray-400 font-normal text-xs">(optional)</span></label>
          <input id="fi-email" type="email" value="${esc(f.email||'')}" placeholder="john@example.com"
            oninput="S.f.email=this.value"
            class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg bg-white">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Issue date</label>
          <input id="fi-issue" type="date" value="${f.issueDate}"
            oninput="S.f.issueDate=this.value"
            class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg bg-white">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Expiration date <span class="text-red-400">*</span></label>
          <input id="fi-exp" type="date" value="${f.expiresDate}"
            oninput="S.f.expiresDate=this.value"
            class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg bg-white">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Hunt species / notes <span class="text-gray-400 font-normal text-xs">(optional)</span></label>
        <input id="fi-species" type="text" value="${esc(f.species)}" placeholder="e.g. Quail, Pheasant — no bag limit on dove"
          oninput="S.f.species=this.value"
          class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg bg-white">
      </div>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 mb-6">
      <div class="flex items-center gap-2 mb-5">
        <svg class="w-3.5 h-3.5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">GPS Coordinates</span>
      </div>
      ${coordRows}
      <button onclick="addCoord()" class="w-full py-3 border-2 border-dashed border-gray-200 rounded-lg text-sm text-gray-400 hover:border-forest-300 hover:text-forest-600 transition-all flex items-center justify-center gap-2 font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Add coordinate
      </button>
    </div>

    <div class="flex items-center gap-3">
      <button onclick="submitForm()" class="btn-forest flex items-center gap-2 px-6 py-2.5 rounded-lg text-sm font-semibold">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
        ${editing ? 'Save & copy updated link' : 'Generate permit link'}
      </button>
      <button onclick="clearForm()" class="btn-outline flex items-center gap-2 px-5 py-2.5 rounded-lg text-sm font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Clear form
      </button>
    </div>`;
}

// ─── Tab: Issued Permits ──────────────────────────────────
function tabIssued() {
  const all = db.all();
  if (!all.length) return `
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-16 text-center">
      <div class="text-5xl mb-4">🌾</div>
      <h3 class="text-gray-700 font-semibold mb-1">No permits yet</h3>
      <p class="text-gray-400 text-sm">Create your first permit in the <button onclick="setTab('new')" class="text-forest-600 underline font-medium">New permit</button> tab.</p>
    </div>`;

  const active = all.filter(p => status(p)==='Active').length;
  const expired = all.filter(p => status(p)==='Expired').length;
  const revoked = all.filter(p => status(p)==='Revoked').length;

  const rows = all.map(p => {
    const st = status(p);
    const badge = st==='Active'
      ? 'bg-green-50 text-green-700 border-green-200'
      : st==='Expired'
      ? 'bg-amber-50 text-amber-700 border-amber-200'
      : 'bg-red-50 text-red-600 border-red-200';
    return `<tr class="border-b border-gray-50 hover:bg-gray-50/50 transition-colors group">
      <td class="py-3 pl-5 pr-4"><span class="font-mono text-xs font-bold text-forest-700 bg-forest-50 px-2 py-0.5 rounded">${esc(p.permitNumber)}</span></td>
      <td class="py-3 px-4"><p class="text-sm font-semibold text-gray-800 leading-snug">${esc(p.holderName)}</p>${p.email?`<p class="text-xs text-gray-400 mt-0.5">${esc(p.email)}</p>`:''}</td>
      <td class="py-3 px-4 text-sm text-gray-600">${esc(p.ranchName)}</td>
      <td class="py-3 px-4 text-xs text-gray-500">${fmtDate(p.issueDate)}</td>
      <td class="py-3 px-4 text-xs text-gray-500">${fmtDate(p.expiresDate)}</td>
      <td class="py-3 px-4"><span class="inline-flex text-xs font-semibold px-2.5 py-1 rounded-full border ${badge}">${st}</span></td>
      <td class="py-3 pl-4 pr-5">
        <div class="flex items-center gap-0.5 opacity-60 group-hover:opacity-100 transition-opacity">
          <button onclick="doEdit('${p.id}')" title="Edit" class="action-btn hover:bg-forest-100 text-forest-600">${icoEdit()}</button>
          <button onclick="doCopy('${p.id}')" title="Copy link" class="action-btn hover:bg-forest-100 text-forest-600">${icoLink()}</button>
          <button onclick="doPreview('${p.id}')" title="Preview card" class="action-btn hover:bg-forest-100 text-forest-600">${icoEye()}</button>
          <button onclick="doRevoke('${p.id}')" title="${p.deactivated?'Reactivate':'Revoke'}"
            class="action-btn hover:bg-amber-50 ${p.deactivated?'text-amber-500':'text-gray-400'}">${icoSlash()}</button>
          <button onclick="doDelete('${p.id}')" title="Delete" class="action-btn hover:bg-red-50 text-gray-300 hover:text-red-400">${icoTrash()}</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  return `
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
      <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
        <div>
          <h2 class="text-sm font-bold text-gray-800">Issued Permits</h2>
          <p class="text-xs text-gray-400 mt-0.5">${all.length} total · <span class="text-green-600 font-medium">${active} active</span>${expired?` · <span class="text-amber-600 font-medium">${expired} expired</span>`:''}${revoked?` · <span class="text-red-500 font-medium">${revoked} revoked</span>`:''}</p>
        </div>
        <button onclick="setTab('new')" class="btn-forest flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-semibold">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
          New permit
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead><tr class="bg-gray-50/60 border-b border-gray-100">
            <th class="text-left py-2.5 pl-5 pr-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Permit #</th>
            <th class="text-left py-2.5 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Holder</th>
            <th class="text-left py-2.5 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Ranch</th>
            <th class="text-left py-2.5 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Issued</th>

// ─── Upload utilities ──────────────────────────────────────
function colKey(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }

function mapCol(row, ...keys) {
  for (const k of keys) { const v = row[k]; if (v !== undefined && v !== '') return String(v).trim(); }
  return '';
}

function normalizeDate(raw) {
  if (!raw) return '';
  const s = String(raw).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const mdy = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (mdy) return `${mdy[3]}-${mdy[1].padStart(2,'0')}-${mdy[2].padStart(2,'0')}`;
  const mdyS = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/);
  if (mdyS) { const y = +mdyS[3] < 50 ? `20${mdyS[3]}` : `19${mdyS[3]}`; return `${y}-${mdyS[1].padStart(2,'0')}-${mdyS[2].padStart(2,'0')}`; }
  const d = new Date(s); if (!isNaN(d)) return d.toISOString().split('T')[0];
  return s;
}

function parseCoordStr(raw) {
  if (!raw) return [];
  return String(raw).split(/[|;\n]+/).map(s => s.trim()).filter(Boolean).map(part => {
    const ci = part.lastIndexOf(':');
    let cp = part, label = '';
    if (ci > 0 && isNaN(Number(part.slice(ci+1).trim()))) { label = part.slice(ci+1).trim(); cp = part.slice(0,ci).trim(); }
    const nums = cp.split(',').map(x => x.trim());
    return { lat: nums[0]||'', lng: nums[1]||'', label: label || nums[2]||'' };
  });
}

function normalizeRow(raw) {
  const r = {};
  for (const k of Object.keys(raw)) r[colKey(k)] = String(raw[k]??'').trim();
  return r;
}

function rowToFields(r) {
  const holderName = mapCol(r,'name','holder','permit holder','hunter','hunter name','full name','person');
  const email      = mapCol(r,'email','email address','e mail','e-mail');
  const ranchName  = mapCol(r,'ranch','ranch name','property','location','property name','farm','land','hunt area');
  const coordsRaw  = mapCol(r,'coordinates','coords','gps','lat lng','latlng','coordinate','gps coordinates');
  const lat        = mapCol(r,'lat','latitude');
  const lng        = mapCol(r,'lng','lon','long','longitude');
  const coordLabel = mapCol(r,'label','area','area label','coord label');
  const issueDate  = normalizeDate(mapCol(r,'issue date','issued','start','start date','issue','date issued','issued date'));
  const expiresDate= normalizeDate(mapCol(r,'expiration','expiration date','expires','expiry','end','end date','expire date','exp date','exp'));
  const species    = mapCol(r,'species','notes','species notes','species / notes','species/notes','hunt species','game');
  const permitNum  = mapCol(r,'permit number','permit #','permit no','permit num','permit');
  let coords = coordsRaw ? parseCoordStr(coordsRaw) : (lat||lng) ? [{lat,lng,label:coordLabel}] : [];
  return { holderName, email, ranchName, coords, issueDate: issueDate||today(), expiresDate, species, permitNum };
}

function parseCSVText(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  function parseRow(line) {
    const res=[]; let cur='', inQ=false;
    for (let i=0;i<line.length;i++) {
      const c=line[i];
      if (c==='"') { if (inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ; }
      else if (c===','&&!inQ){res.push(cur.trim());cur='';}
      else cur+=c;
    }
    res.push(cur.trim()); return res;
  }
  const headers = parseRow(lines[0]).map(colKey);
  const rows=[];
  for (let i=1;i<lines.length;i++){
    if (!lines[i].trim()) continue;
    const cells=parseRow(lines[i]); const row={};
    headers.forEach((h,j)=>{row[h]=cells[j]??'';});
    rows.push(row);
  }
  return rows;
}

function parseXLSXBuffer(buf) {
  const wb = XLSX.read(buf,{type:'array',cellDates:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws,{raw:false,dateNF:'yyyy-mm-dd'}).map(normalizeRow);
}

async function processUploadFile(file) {
  S.upload.parseError = null;
  const name = file.name.toLowerCase();
  try {
    let raw;
    if (name.endsWith('.csv')) { raw = parseCSVText(await file.text()); }
    else if (name.endsWith('.xlsx')||name.endsWith('.xls')) {
      if (typeof XLSX==='undefined') throw new Error('Excel library not loaded — please refresh and try again.');
      raw = parseXLSXBuffer(await file.arrayBuffer());
    } else { throw new Error('Unsupported file type. Please upload .xlsx, .xls, or .csv.'); }
    if (!raw.length) throw new Error('No data rows found. Make sure the file has a header row followed by data.');
    S.upload.rows = raw.map(rowToFields);
  } catch(e) { S.upload.parseError = e.message; }
  renderAdmin();
}

function handleUploadDrop(e) { const f=e.dataTransfer.files[0]; if(f) processUploadFile(f); }
function handleUploadInput(e) { const f=e.target.files[0]; if(f) processUploadFile(f); }
function resetUpload() { S.upload={ rows:null, results:null, generating:false, parseError:null }; renderAdmin(); }

async function bulkGenerate() {
  const valid = (S.upload.rows||[]).filter(r => r.holderName && r.ranchName && r.expiresDate);
  if (!valid.length) return;
  S.upload.generating = true;
  S.upload.results = [];
  renderAdmin();
  const yr = new Date().getFullYear();
  const base = db.all().filter(p => (p.permitNumber||'').includes(`-${yr}-`)).length;
  for (let i=0; i<valid.length; i++) {
    const fields = valid[i];
    const n = base + i + 1;
    const permitNumber = fields.permitNum || `BP-${yr}-${String(n).padStart(3,'0')}`;
    try {
      const permit = {
        id: crypto.randomUUID(), permitNumber,
        ranchName: fields.ranchName, holderName: fields.holderName,
        email: fields.email, issueDate: fields.issueDate,
        expiresDate: fields.expiresDate, species: fields.species,
        coords: fields.coords.filter(c => c.lat||c.lng),
        deactivated: false, createdAt: new Date().toISOString(),
      };
      await db.upsert(permit);
      S.upload.results.push({ permit, link: makeLink(permit), error: null });
    } catch(e) {
      S.upload.results.push({ permit:null, fields, error: e.message||'Failed to save' });
    }
    renderAdmin();
  }
  S.upload.generating = false;
  renderAdmin();
  const ok = S.upload.results.filter(r=>!r.error).length;
  toast(`${ok} permit${ok!==1?'s':''} generated!`, 3200);
}

function copyAllPermitLinks() {
  const lines = (S.upload.results||[]).filter(r=>!r.error)
    .map(r=>`${r.permit.holderName} — ${r.permit.ranchName}\n${r.link}`).join('\n\n');
  copyText(lines, 'All permit links copied!');
}

function downloadPermitTemplate() {
  const csv = [
    'Name,Email,Ranch,Coordinates,Issue Date,Expiration Date,Species/Notes',
    'John Smith,john@email.com,Rolling Plains Ranch,"32.7157,-97.3297",2026-10-01,2027-01-15,Quail',
    'Jane Doe,jane@email.com,West Texas Acres,"33.1234,-98.5678:North Field|32.9876,-97.1234:South Pasture",2026-10-01,2027-01-15,Pheasant',
  ].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'permit-template.csv'; a.click();
}

// ─── Customer View ────────────────────────────────────────
function renderCustomer(p) {
  document.title = `${p.ranchName || 'Bird Hunt'} — Permit ${p.permitNumber || ''}`;
  document.getElementById('app').innerHTML = `
    <div class="min-h-screen flex flex-col items-center justify-center p-4 pt-8 pb-10" style="background:#EAE7DF">
      ${permitCard(p)}
      <p class="mt-5 text-xs text-gray-400 text-center max-w-xs leading-relaxed">
        This is your official digital hunting permit. Keep this page accessible during all hunting activities.
      </p>
    </div>`;
}

// ─── Icons ────────────────────────────────────────────────

const icoLink  = () => svg(`<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>`);

const icoTrash = () => svg(`<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>`);

// ─── Actions ──────────────────────────────────────────────
function setTab(t) {
  S.tab = t;
  if (t === 'new' && !S.editId) S.f = freshForm();
  renderAdmin();
}

function addCoord() {
  S.f.coords.push({ lat:'', lng:'', label:'' });
  renderAdmin();
  requestAnimationFrame(() => {
    const inputs = document.querySelectorAll('.coord-card input');
    if (inputs.length) inputs[inputs.length - 3]?.focus();
  });
}

function rmCoord(i) { S.f.coords.splice(i,1); renderAdmin(); }
function updCoord(i,f,v) { S.f.coords[i][f] = v; }

function syncFromDOM() {
  const g = id => document.getElementById(id)?.value ?? '';
  S.f.ranchName = g('fi-ranch'); S.f.permitNumber = g('fi-num');
  S.f.holderName = g('fi-holder'); S.f.email = g('fi-email');
  S.f.issueDate = g('fi-issue'); S.f.expiresDate = g('fi-exp');
  S.f.species = g('fi-species');
}

async function submitForm() {
  syncFromDOM();
  const f = S.f;
  if (!f.ranchName.trim()) { toast('Ranch name is required'); return; }
  if (!f.holderName.trim()) { toast('Permit holder name is required'); return; }
  if (!f.expiresDate) { toast('Expiration date is required'); return; }

  const prev = S.editId ? db.find(S.editId) : null;
  const permit = {
    id: S.editId || crypto.randomUUID(),
    permitNumber: f.permitNumber.trim() || nextNum(),
    ranchName: f.ranchName.trim(),
    holderName: f.holderName.trim(),
    email: (f.email || '').trim(),
    issueDate: f.issueDate,
    expiresDate: f.expiresDate,
    species: f.species.trim(),
    coords: f.coords.filter(c => c.lat.trim() || c.lng.trim()),
    deactivated: false,
    createdAt: prev?.createdAt || new Date().toISOString(),
  };

  await db.upsert(permit);
  copyText(makeLink(permit), S.editId ? 'Updated link copied — resend to customer' : 'Permit link copied to clipboard!');
  S.editId = null; S.f = freshForm(); S.tab = 'issued';
  renderAdmin();
}

function clearForm() { S.editId = null; S.f = freshForm(); renderAdmin(); }
function cancelEdit() { S.editId = null; S.f = freshForm(); renderAdmin(); }

function doEdit(id) {
  const p = db.find(id); if (!p) return;
  S.editId = id;
  S.f = {
    ranchName: p.ranchName, permitNumber: p.permitNumber,
    holderName: p.holderName, email: p.email || '', issueDate: p.issueDate,
    expiresDate: p.expiresDate, species: p.species || '',
    coords: (p.coords||p.coordinates||[]).length ? [...(p.coords||p.coordinates)] : [{lat:'',lng:'',label:''}],
  };
  S.tab = 'new'; renderAdmin();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function doCopy(id) {
  const p = db.find(id); if (!p) return;
  copyText(makeLink(p));
}

function doPreview(id) {
  const p = db.find(id); if (!p) return;
  S.viewerPermit = p; S.tab = 'viewer'; renderAdmin();
}

async function doRevoke(id) {
  const p = db.find(id); if (!p) return;
  p.deactivated = !p.deactivated; await db.upsert(p);
  copyText(makeLink(p), p.deactivated
    ? `Permit ${p.permitNumber} revoked — resend the updated link to the customer`
    : `Permit ${p.permitNumber} reactivated — resend the updated link to the customer`);
  renderAdmin();
}

async function doDelete(id) {
  const p = db.find(id); if (!p) return;
  if (confirm(`Delete permit ${p.permitNumber} for ${p.holderName}?\n\nThis cannot be undone.`)) {
    await db.del(id); toast('Permit deleted'); renderAdmin();
  }
}

// ─── Boot ─────────────────────────────────────────────────
document.getElementById('app').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#4E7A44;font-family:Inter,sans-serif;font-size:14px;">Loading permits…</div>';
firestore.collection(COLL).orderBy('createdAt', 'asc').onSnapshot(snapshot => {
  S.permits = snapshot.docs.map(d => d.data());
  render();
});
</script>
