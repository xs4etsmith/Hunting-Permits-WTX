// ─── Admin password ────────────────────────────────────────
// Change this to whatever password you want your employees to use
const ADMIN_PASSWORD = '2026';
function isAuthed() { return sessionStorage.getItem('adminAuth') === ADMIN_PASSWORD; }

  if (val === ADMIN_PASSWORD) { sessionStorage.setItem('adminAuth', ADMIN_PASSWORD); renderAdmin(); }

// Signature pad instances, keyed by canvas id
const sigPads = {};
// Waiver page state — prevents Firestore re-renders from wiping an in-progress signature
const waiverState = { inProgress: false, submitted: false };

// ─── Storage ───────────────────────────────────────────────
const db = {
  all: () => S.permits,
  find: (id) => S.permits.find(p => p.id === id),
  async upsert(p) { await firestore.collection(COLL).doc(p.id).set(p); },
  async del(id) { await firestore.collection(COLL).doc(id).delete(); },
};

// ─── Helpers ──────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function today() { return new Date().toISOString().split('T')[0]; }
function fmtDate(s) {
  if (!s) return '—';
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
function nextNum() {
  const yr = new Date().getFullYear();
  const n = db.all().filter(p => (p.permitNumber||'').includes(`-${yr}-`)).length + 1;
  return `BP-${yr}-${String(n).padStart(3,'0')}`;
}
function status(p) {
  if (p.deactivated) return 'Revoked';
  if (p.expiresDate && new Date(p.expiresDate + 'T23:59:59') < new Date()) return 'Expired';
  return 'Active';
}
function encode(p) { return btoa(unescape(encodeURIComponent(JSON.stringify(p)))); }
function decode(s) { try { return JSON.parse(decodeURIComponent(escape(atob(s)))); } catch { return null; } }
function makeLink(p) { return `${location.origin}${location.pathname}?v=${encode(p)}`; }

async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement('textarea'); t.value = text; Object.assign(t.style,{position:'fixed',opacity:0}); document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast(msg || 'Permit link copied to clipboard!');
}

function toast(msg, ms = 2800) {
  const el = document.createElement('div'); el.className = 'toast-el'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 310); }, ms);
}

    <path d="M13 50 L17 50 M16 50 L16 47.5" stroke="#7A3D10" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M25 50 L29 50 M28 50 L28 47.5" stroke="#7A3D10" stroke-width="1.9" stroke-linecap="round"/>
  </svg>`;
}

// ─── State ────────────────────────────────────────────────
const S = {
  tab: 'new',
  editId: null,
  viewerPermit: null,
  f: null,
  permits: [],
  waivers: [],
  upload: { rows: null, results: null, generating: false, parseError: null },
  legalView: null, // waiver doc being viewed in modal
};

function freshForm() {
  return { ranchName:'', permitNumber: nextNum(), holderName:'', email:'', issueDate: today(), expiresDate:'', species:'', coords:[{lat:'',lng:'',label:''}] };
}
S.f = freshForm();

// ─── Root render ──────────────────────────────────────────
function makeWaiverLink(p) { return `${location.origin}${location.pathname}?w=${encode(p)}`; }

function render() {
  const params = new URLSearchParams(location.search);
  const v = params.get('v');
  const w = params.get('w');
  // Public routes — no login required
  if (v) { const p = decode(v); if (p) { renderCustomer(p); return; } }
  if (w) {
    const p = decode(w);
    if (p) {
      if (waiverState.submitted) { renderWaiverSuccess(p); return; }
      if (waiverState.inProgress) return;
      renderWaiverSigning(p);
      return;
    }
  }
  // Admin route — requires password
  if (!isAuthed()) { renderLogin(); return; }
  renderAdmin();
}

function renderAdmin() {
  document.getElementById('app').innerHTML = `

}

      <button onclick="cancelEdit()" class="ml-2 text-xs text-gray-400 hover:text-gray-600 underline">Cancel</button>
    </div>` : ''}

    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 mb-4">
      <div class="flex items-center gap-2 mb-5">
        <svg class="w-3.5 h-3.5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>

// ─── Tab: Issued Permits ──────────────────────────────────
function tabIssued() {
  const all = db.all();
  if (!all.length) return `
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-16 text-center">
      <div class="text-5xl mb-4">🌾</div>
      <h3 class="text-gray-700 font-semibold mb-1">No permits yet</h3>
      <p class="text-gray-400 text-sm">Create your first permit in the <button onclick="setTab('new')" class="text-forest-600 underline font-medium">New permit</button> tab.</p>
    </div>`;

  const active = all.filter(p => status(p)==='Active').length;
  const expired = all.filter(p => status(p)==='Expired').length;
  const revoked = all.filter(p => status(p)==='Revoked').length;

  const rows = all.map(p => {
    const st = status(p);
    const badge = st==='Active'
      ? 'bg-green-50 text-green-700 border-green-200'
      : st==='Expired'
      ? 'bg-amber-50 text-amber-700 border-amber-200'
      : 'bg-red-50 text-red-600 border-red-200';
    return `<tr class="border-b border-gray-50 hover:bg-gray-50/50 transition-colors group">
      <td class="py-3 pl-5 pr-4"><span class="font-mono text-xs font-bold text-forest-700 bg-forest-50 px-2 py-0.5 rounded">${esc(p.permitNumber)}</span></td>
      <td class="py-3 px-4"><p class="text-sm font-semibold text-gray-800 leading-snug">${esc(p.holderName)}</p>${p.email?`<p class="text-xs text-gray-400 mt-0.5">${esc(p.email)}</p>`:''}</td>
      <td class="py-3 px-4 text-sm text-gray-600">${esc(p.ranchName)}</td>
      <td class="py-3 px-4 text-xs text-gray-500">${fmtDate(p.issueDate)}</td>
      <td class="py-3 px-4 text-xs text-gray-500">${fmtDate(p.expiresDate)}</td>
      <td class="py-3 px-4"><span class="inline-flex text-xs font-semibold px-2.5 py-1 rounded-full border ${badge}">${st}</span></td>
      <td class="py-3 pl-4 pr-5">
        <div class="flex items-center gap-0.5 opacity-60 group-hover:opacity-100 transition-opacity">
          <button onclick="doEdit('${p.id}')" title="Edit" class="action-btn hover:bg-forest-100 text-forest-600">${icoEdit()}</button>
          <button onclick="doCopy('${p.id}')" title="Copy link" class="action-btn hover:bg-forest-100 text-forest-600">${icoLink()}</button>
          ${p.email ? `<button onclick="sendPermitEmail('${p.id}')" title="Email permit to ${esc(p.email)}" class="action-btn hover:bg-forest-100 text-forest-600">${icoMail()}</button>` : ''}
          <button onclick="doPreview('${p.id}')" title="Preview card" class="action-btn hover:bg-forest-100 text-forest-600">${icoEye()}</button>
          <button onclick="doRevoke('${p.id}')" title="${p.deactivated?'Reactivate':'Revoke'}"
            class="action-btn hover:bg-amber-50 ${p.deactivated?'text-amber-500':'text-gray-400'}">${icoSlash()}</button>
          <button onclick="doDelete('${p.id}')" title="Delete" class="action-btn hover:bg-red-50 text-gray-300 hover:text-red-400">${icoTrash()}</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  return `
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
      <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
        <div>
          <h2 class="text-sm font-bold text-gray-800">Issued Permits</h2>
          <p class="text-xs text-gray-400 mt-0.5">${all.length} total · <span class="text-green-600 font-medium">${active} active</span>${expired?` · <span class="text-amber-600 font-medium">${expired} expired</span>`:''}${revoked?` · <span class="text-red-500 font-medium">${revoked} revoked</span>`:''}</p>
        </div>
        <button onclick="setTab('new')" class="btn-forest flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-semibold">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
          New permit
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead><tr class="bg-gray-50/60 border-b border-gray-100">
            <th class="text-left py-2.5 pl-5 pr-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Permit #</th>
            <th class="text-left py-2.5 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Holder</th>
            <th class="text-left py-2.5 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Ranch</th>
            <th class="text-left py-2.5 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Issued</th>
            <th class="text-left py-2.5 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Expires</th>
            <th class="text-left py-2.5 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Status</th>
            <th class="text-left py-2.5 pl-4 pr-5 text-xs font-bold text-gray-400 uppercase tracking-wider">Actions</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

// ─── Tab: Viewer ──────────────────────────────────────────
function tabViewer() {
  if (!S.viewerPermit) return `
    <div class="text-center py-16">
      <p class="text-gray-400 text-sm">Click the <span class="text-gray-600 font-medium">👁 Preview</span> button on any permit in
        <button onclick="setTab('issued')" class="text-forest-600 underline font-medium">Issued permits</button>
        to preview the customer card here.
      </p>
    </div>`;

  const p = S.viewerPermit;
  return `
    <div class="mb-5 flex items-center justify-between">
      <button onclick="setTab('issued')" class="flex items-center gap-1.5 text-sm text-forest-600 hover:text-forest-800 font-medium transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        Back to permits
      </button>
      <div class="flex gap-2">
        <button onclick="doCopy('${esc(p.id)}')" class="btn-forest flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-semibold">${icoLink()} Copy customer link</button>
        <button onclick="doEdit('${esc(p.id)}')" class="btn-outline flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-medium">${icoEdit()} Edit permit</button>
      </div>
    </div>
    <div class="flex justify-center">
      ${permitCard(p)}
    </div>
    <p class="text-center text-xs text-gray-400 mt-4">Preview of what the customer sees at their link.</p>`;
}

// ─── Permit Card HTML ─────────────────────────────────────
function permitCard(p) {
  const st = status(p);
  const stBadge = st==='Active'
    ? 'bg-green-50 text-green-700 border border-green-200'
    : st==='Expired'
    ? 'bg-amber-50 text-amber-700 border border-amber-200'
    : 'bg-red-50 text-red-600 border border-red-200';

  const coords = (p.coords || p.coordinates || []).filter(c => c.lat || c.lng);
  const coordRows = coords.map((c,i) => `
    <div class="flex items-center gap-3 py-2.5 ${i < coords.length-1 ? 'border-b border-gray-100' : ''}">
      <span style="background:#1C2D1C" class="w-6 h-6 rounded-full text-white text-xs font-bold flex items-center justify-center flex-shrink-0">${i+1}</span>
      <span class="text-sm text-gray-700 font-medium flex-1">${esc(c.lat)}, ${esc(c.lng)}</span>
      ${c.label ? `<span class="text-xs text-gray-500 flex-shrink-0 text-right">${esc(c.label)}</span>` : ''}
    </div>`).join('');

  return `
    <div class="permit-shadow bg-white rounded-2xl overflow-hidden w-full max-w-sm">
      <div style="background:#1C2D1C" class="px-5 py-5 flex items-center gap-3.5">
        ${bird(44)}
        <div>
          <h1 class="text-white text-xl font-bold tracking-tight leading-snug">${esc(p.ranchName) || 'Ranch Name'}</h1>
          <p style="color:#6A9E5E" class="text-xs font-bold uppercase tracking-widest mt-0.5">Bird Hunt Permit</p>
        </div>
      </div>

      <div class="px-5 pt-5 pb-4">
        <div class="mb-4">
          <span class="bg-gray-100 text-gray-500 text-xs font-bold px-2.5 py-1 rounded-full tracking-wide">${esc(p.permitNumber) || '—'}</span>
        </div>

        <div class="grid grid-cols-2 gap-x-4 gap-y-4">
          <div>
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Permit Holder</p>
            <p class="text-base font-bold text-gray-800 leading-tight">${esc(p.holderName) || '—'}</p>
          </div>
          <div>
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Status</p>
            <span class="inline-block text-xs font-semibold px-2.5 py-1 rounded-full ${stBadge}">${st}</span>
          </div>
          <div>
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Issue Date</p>
            <p class="text-sm font-semibold" style="color:#2E4A2D">${fmtDate(p.issueDate)}</p>
          </div>
          <div>
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Expires</p>
            <p class="text-sm font-semibold" style="color:#2E4A2D">${fmtDate(p.expiresDate)}</p>
          </div>
          ${p.species ? `<div class="col-span-2">
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Species / Notes</p>
            <p class="text-sm font-semibold text-gray-800">${esc(p.species)}</p>
          </div>` : ''}
        </div>

        ${coords.length ? `<div class="mt-4">
          <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2.5">Hunt Area Coordinates</p>
          <div class="bg-gray-50 rounded-xl px-4 py-1">${coordRows}</div>
        </div>` : ''}
      </div>

      <div class="px-5 py-3 border-t border-gray-100 flex items-center justify-between">
        <p class="text-xs text-gray-400 italic">Retain this permit during all hunting activities</p>
        <p class="text-xs text-gray-400 font-medium ml-3 flex-shrink-0">Exp. ${fmtDate(p.expiresDate)}</p>
      </div>
    </div>`;
}

// ─── Tab: Bulk Upload ─────────────────────────────────────
function tabUpload() {
  const u = S.upload;

  // ── Results view ──
  if (u.results) {
    const ok = u.results.filter(r => !r.error);
    const bad = u.results.filter(r => r.error);
    const rows = u.results.map((r, i) => r.error
      ? `<tr class="border-b border-gray-50">
           <td class="py-2.5 pl-5 pr-4 text-xs text-gray-400">${i+1}</td>
           <td class="py-2.5 px-4 text-sm text-gray-700">${esc(r.fields?.holderName||'—')}</td>
           <td class="py-2.5 px-4 text-sm text-gray-600">${esc(r.fields?.ranchName||'—')}</td>
           <td class="py-2.5 px-4 text-xs text-red-500 col-span-2">${esc(r.error)}</td>
           <td class="py-2.5 pl-4 pr-5"></td>
         </tr>`
      : `<tr class="border-b border-gray-50 hover:bg-gray-50/50">
           <td class="py-2.5 pl-5 pr-4 text-xs text-gray-400">${i+1}</td>
           <td class="py-2.5 px-4"><p class="text-sm font-semibold text-gray-800">${esc(r.permit.holderName)}</p>${r.permit.email?`<p class="text-xs text-gray-400">${esc(r.permit.email)}</p>`:''}</td>
           <td class="py-2.5 px-4 text-sm text-gray-600">${esc(r.permit.ranchName)}</td>
           <td class="py-2.5 px-4"><span class="font-mono text-xs font-bold text-forest-700 bg-forest-50 px-2 py-0.5 rounded">${esc(r.permit.permitNumber)}</span></td>
           <td class="py-2.5 px-4 text-xs text-gray-500">${fmtDate(r.permit.expiresDate)}</td>
           <td class="py-2.5 pl-4 pr-5">
             <button onclick="copyText('${esc(r.link)}','Link copied!')" class="btn-forest flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold">${icoLink()} Copy link</button>
           </td>
         </tr>`
    ).join('');
    return `
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <div>
            <h2 class="text-sm font-bold text-gray-800">${ok.length} permit${ok.length!==1?'s':''} generated</h2>
            <p class="text-xs text-gray-400 mt-0.5"><span class="text-green-600 font-medium">${ok.length} success</span>${bad.length?` · <span class="text-red-500 font-medium">${bad.length} failed</span>`:''}</p>
          </div>
          <div class="flex gap-2">
            ${ok.length ? `<button onclick="copyAllPermitLinks()" class="btn-forest flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-semibold">${icoLink()} Copy all links</button>` : ''}
            <button onclick="resetUpload()" class="btn-outline flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-medium">Upload another file</button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead><tr class="bg-gray-50/60 border-b border-gray-100">
              <th class="text-left py-2.5 pl-5 pr-4 text-xs font-bold text-gray-400 uppercase tracking-wider">#</th>
              <th class="text-left py-2.5 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Holder</th>
              <th class="text-left py-2.5 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Ranch</th>
              <th class="text-left py-2.5 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Permit #</th>
              <th class="text-left py-2.5 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Expires</th>
              <th class="text-left py-2.5 pl-4 pr-5 text-xs font-bold text-gray-400 uppercase tracking-wider">Link</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }

  // ── Generating progress ──
  if (u.generating) {
    const done = (u.results||[]).length;
    const total = (u.rows||[]).filter(r => r.holderName && r.ranchName && r.expiresDate).length;
    const pct = total ? Math.round(done/total*100) : 0;
    return `
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-12 text-center">
        <div class="w-10 h-10 border-4 border-forest-200 border-t-forest-600 rounded-full animate-spin mx-auto mb-4"></div>
        <p class="text-sm font-semibold text-gray-700 mb-1">Generating permits…</p>
        <p class="text-xs text-gray-400 mb-4">${done} of ${total} complete</p>
        <div class="w-64 mx-auto bg-gray-100 rounded-full h-2 overflow-hidden">
          <div style="width:${pct}%;background:#1C2D1C;transition:width 0.3s" class="h-full rounded-full"></div>
        </div>
      </div>`;
  }

  // ── Preview table ──
  if (u.rows) {
    const valid = u.rows.filter(r => r.holderName && r.ranchName && r.expiresDate);
    const skipped = u.rows.length - valid.length;
    const previewRows = u.rows.map((r, i) => {
      const missing = [];
      if (!r.holderName) missing.push('Name');
      if (!r.ranchName) missing.push('Ranch');
      if (!r.expiresDate) missing.push('Expiration date');
      const isValid = !missing.length;
      return `<tr class="border-b border-gray-50 ${isValid?'hover:bg-gray-50/50':'bg-red-50/30'}">
        <td class="py-2.5 pl-5 pr-4 text-xs text-gray-400">${i+1}</td>
        <td class="py-2.5 px-4"><p class="text-sm font-semibold text-gray-800 leading-snug">${esc(r.holderName||'—')}</p>${r.email?`<p class="text-xs text-gray-400">${esc(r.email)}</p>`:''}</td>
        <td class="py-2.5 px-4 text-sm text-gray-600">${esc(r.ranchName||'—')}</td>
        <td class="py-2.5 px-4 text-xs text-gray-500">${r.issueDate ? fmtDate(r.issueDate) : '—'}</td>
        <td class="py-2.5 px-4 text-xs ${r.expiresDate?'text-gray-500':'text-red-400 font-medium'}">${r.expiresDate ? fmtDate(r.expiresDate) : 'Missing'}</td>
        <td class="py-2.5 px-4 text-xs text-gray-500">${r.coords.length ? `${r.coords.length} point${r.coords.length!==1?'s':''}` : '—'}</td>
        <td class="py-2.5 pl-4 pr-5">
          ${isValid
            ? `<span class="inline-flex items-center gap-1 text-xs font-semibold text-green-700 bg-green-50 border border-green-200 px-2 py-0.5 rounded-full">✓ Ready</span>`
            : `<span class="inline-flex items-center gap-1 text-xs font-semibold text-red-600 bg-red-50 border border-red-200 px-2 py-0.5 rounded-full" title="Missing: ${missing.join(', ')}">⚠ Skip</span>`}
        </td>
      </tr>`;
    }).join('');
    return `
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
          <div>
            <h2 class="text-sm font-bold text-gray-800">Preview — ${u.rows.length} row${u.rows.length!==1?'s':''} found</h2>
            <p class="text-xs text-gray-400 mt-0.5"><span class="text-green-600 font-medium">${valid.length} will generate</span>${skipped?` · <span class="text-amber-600 font-medium">${skipped} skipped (missing required fields)</span>`:''}</p>
          </div>
          <div class="flex gap-2">
            <button onclick="resetUpload()" class="btn-outline flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-medium">Upload different file</button>
            ${valid.length ? `<button onclick="bulkGenerate()" class="btn-forest flex items-center gap-1.5 px-4 py-2 rounded-lg text-xs font-semibold">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
              Generate ${valid.length} permit${valid.length!==1?'s':''}
            </button>` : ''}
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead><tr class="bg-gray-50/60 border-b border-gray-100">
              <th class="text-left py-2.5 pl-5 pr-4 text-xs font-bold text-gray-400 uppercase tracking-wider">#</th>
              <th class="text-left py-2.5 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Holder</th>
              <th class="text-left py-2.5 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Ranch</th>
              <th class="text-left py-2.5 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Issue Date</th>
              <th class="text-left py-2.5 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Expires</th>
              <th class="text-left py-2.5 px-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Coords</th>
              <th class="text-left py-2.5 pl-4 pr-5 text-xs font-bold text-gray-400 uppercase tracking-wider">Status</th>
            </tr></thead>
            <tbody>${previewRows}</tbody>
          </table>
        </div>
      </div>`;
  }

  // ── Drop zone ──
  const err = u.parseError;
  return `
    <div class="max-w-2xl mx-auto">
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 mb-4">
        <div class="flex items-center gap-2 mb-5">
          <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
          <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Bulk Upload</span>
        </div>
        ${err ? `<div class="mb-4 px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-600">${esc(err)}</div>` : ''}
        <div
          ondragover="event.preventDefault();this.classList.add('border-forest-400','bg-forest-50/30')"
          ondragleave="this.classList.remove('border-forest-400','bg-forest-50/30')"
          ondrop="event.preventDefault();this.classList.remove('border-forest-400','bg-forest-50/30');handleUploadDrop(event)"
          class="border-2 border-dashed border-gray-200 rounded-xl p-10 text-center transition-all cursor-pointer hover:border-forest-300 hover:bg-forest-50/20"
          onclick="document.getElementById('bulk-file-input').click()">
          <input id="bulk-file-input" type="file" accept=".xlsx,.xls,.csv" class="hidden" onchange="handleUploadInput(event)">
          <svg class="w-8 h-8 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <p class="text-sm font-semibold text-gray-600 mb-1">Drop your file here, or click to browse</p>
          <p class="text-xs text-gray-400">Accepts .xlsx, .xls (Excel) and .csv — first row must be column headers</p>
        </div>
        <div class="mt-4 flex items-center justify-between">
          <p class="text-xs text-gray-400">Google Sheets: File → Download → .xlsx or .csv</p>
          <button onclick="downloadPermitTemplate()" class="flex items-center gap-1.5 text-xs text-forest-600 hover:text-forest-800 font-medium transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Download template
          </button>
        </div>
      </div>
      <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-5">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Column guide</p>
        <div class="grid grid-cols-2 gap-x-8 gap-y-2 text-xs text-gray-600">
          <div><span class="font-semibold text-gray-800">Name</span> <span class="text-gray-400">(or Holder, Hunter)</span> <span class="text-red-400 font-medium">*</span></div>
          <div><span class="font-semibold text-gray-800">Ranch</span> <span class="text-gray-400">(or Ranch Name, Property)</span> <span class="text-red-400 font-medium">*</span></div>
          <div><span class="font-semibold text-gray-800">Expiration Date</span> <span class="text-gray-400">(or Expires, End Date)</span> <span class="text-red-400 font-medium">*</span></div>
          <div><span class="font-semibold text-gray-800">Email</span> <span class="text-gray-400">optional</span></div>
          <div><span class="font-semibold text-gray-800">Issue Date</span> <span class="text-gray-400">defaults to today</span></div>

// ─── Upload utilities ──────────────────────────────────────
function colKey(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }

function mapCol(row, ...keys) {
  for (const k of keys) { const v = row[k]; if (v !== undefined && v !== '') return String(v).trim(); }
  return '';
}

function normalizeDate(raw) {
  if (!raw) return '';
  const s = String(raw).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const mdy = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (mdy) return `${mdy[3]}-${mdy[1].padStart(2,'0')}-${mdy[2].padStart(2,'0')}`;
  const mdyS = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/);
  if (mdyS) { const y = +mdyS[3] < 50 ? `20${mdyS[3]}` : `19${mdyS[3]}`; return `${y}-${mdyS[1].padStart(2,'0')}-${mdyS[2].padStart(2,'0')}`; }
  const d = new Date(s); if (!isNaN(d)) return d.toISOString().split('T')[0];
  return s;
}

function parseCoordStr(raw) {
  if (!raw) return [];
  return String(raw).split(/[|;\n]+/).map(s => s.trim()).filter(Boolean).map(part => {
    const ci = part.lastIndexOf(':');
    let cp = part, label = '';
    if (ci > 0 && isNaN(Number(part.slice(ci+1).trim()))) { label = part.slice(ci+1).trim(); cp = part.slice(0,ci).trim(); }
    const nums = cp.split(',').map(x => x.trim());
    return { lat: nums[0]||'', lng: nums[1]||'', label: label || nums[2]||'' };
  });
}

function normalizeRow(raw) {
  const r = {};
  for (const k of Object.keys(raw)) r[colKey(k)] = String(raw[k]??'').trim();
  return r;
}

function rowToFields(r) {
  const holderName = mapCol(r,'name','holder','permit holder','hunter','hunter name','full name','person');
  const email      = mapCol(r,'email','email address','e mail','e-mail');
  const ranchName  = mapCol(r,'ranch','ranch name','property','location','property name','farm','land','hunt area');
  const coordsRaw  = mapCol(r,'coordinates','coords','gps','lat lng','latlng','coordinate','gps coordinates');
  const lat        = mapCol(r,'lat','latitude');
  const lng        = mapCol(r,'lng','lon','long','longitude');
  const coordLabel = mapCol(r,'label','area','area label','coord label');
  const issueDate  = normalizeDate(mapCol(r,'issue date','issued','start','start date','issue','date issued','issued date'));
  const expiresDate= normalizeDate(mapCol(r,'expiration','expiration date','expires','expiry','end','end date','expire date','exp date','exp'));
  const species    = mapCol(r,'species','notes','species notes','species / notes','species/notes','hunt species','game');
  const permitNum  = mapCol(r,'permit number','permit #','permit no','permit num','permit');
  let coords = coordsRaw ? parseCoordStr(coordsRaw) : (lat||lng) ? [{lat,lng,label:coordLabel}] : [];
  return { holderName, email, ranchName, coords, issueDate: issueDate||today(), expiresDate, species, permitNum };
}

function parseCSVText(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  function parseRow(line) {
    const res=[]; let cur='', inQ=false;
    for (let i=0;i<line.length;i++) {
      const c=line[i];
      if (c==='"') { if (inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ; }
      else if (c===','&&!inQ){res.push(cur.trim());cur='';}
      else cur+=c;
    }
    res.push(cur.trim()); return res;
  }
  const headers = parseRow(lines[0]).map(colKey);
  const rows=[];
  for (let i=1;i<lines.length;i++){
    if (!lines[i].trim()) continue;
    const cells=parseRow(lines[i]); const row={};
    headers.forEach((h,j)=>{row[h]=cells[j]??'';});
    rows.push(row);
  }
  return rows;
}

function parseXLSXBuffer(buf) {
  const wb = XLSX.read(buf,{type:'array',cellDates:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws,{raw:false,dateNF:'yyyy-mm-dd'}).map(normalizeRow);
}

async function processUploadFile(file) {
  S.upload.parseError = null;
  const name = file.name.toLowerCase();
  try {
    let raw;
    if (name.endsWith('.csv')) { raw = parseCSVText(await file.text()); }
    else if (name.endsWith('.xlsx')||name.endsWith('.xls')) {
      if (typeof XLSX==='undefined') throw new Error('Excel library not loaded — please refresh and try again.');
      raw = parseXLSXBuffer(await file.arrayBuffer());
    } else { throw new Error('Unsupported file type. Please upload .xlsx, .xls, or .csv.'); }
    if (!raw.length) throw new Error('No data rows found. Make sure the file has a header row followed by data.');
    S.upload.rows = raw.map(rowToFields);
  } catch(e) { S.upload.parseError = e.message; }
  renderAdmin();
}

function handleUploadDrop(e) { const f=e.dataTransfer.files[0]; if(f) processUploadFile(f); }
function handleUploadInput(e) { const f=e.target.files[0]; if(f) processUploadFile(f); }
function resetUpload() { S.upload={ rows:null, results:null, generating:false, parseError:null }; renderAdmin(); }

async function bulkGenerate() {
  const valid = (S.upload.rows||[]).filter(r => r.holderName && r.ranchName && r.expiresDate);
  if (!valid.length) return;
  S.upload.generating = true;
  S.upload.results = [];
  renderAdmin();
  const yr = new Date().getFullYear();
  const base = db.all().filter(p => (p.permitNumber||'').includes(`-${yr}-`)).length;
  for (let i=0; i<valid.length; i++) {
    const fields = valid[i];
    const n = base + i + 1;
    const permitNumber = fields.permitNum || `BP-${yr}-${String(n).padStart(3,'0')}`;
    try {
      const permit = {
        id: crypto.randomUUID(), permitNumber,
        ranchName: fields.ranchName, holderName: fields.holderName,
        email: fields.email, issueDate: fields.issueDate,
        expiresDate: fields.expiresDate, species: fields.species,
        coords: fields.coords.filter(c => c.lat||c.lng),
        deactivated: false, createdAt: new Date().toISOString(),
      };
      await db.upsert(permit);
      S.upload.results.push({ permit, link: makeLink(permit), error: null });
    } catch(e) {
      S.upload.results.push({ permit:null, fields, error: e.message||'Failed to save' });
    }
    renderAdmin();
  }
  S.upload.generating = false;
  renderAdmin();
  const ok = S.upload.results.filter(r=>!r.error).length;
  toast(`${ok} permit${ok!==1?'s':''} generated!`, 3200);
}

function copyAllPermitLinks() {
  const lines = (S.upload.results||[]).filter(r=>!r.error)
    .map(r=>`${r.permit.holderName} — ${r.permit.ranchName}\n${r.link}`).join('\n\n');
  copyText(lines, 'All permit links copied!');
}

async function sendPermitEmail(id) {
  const p = db.find(id); if (!p || !p.email) return;
  if (!ejReady()) { toast('Configure EmailJS first — see Legal Forms tab'); return; }
  try {
    await emailjs.send(EJ_SERVICE_ID, EJ_PERMIT_TPL, {
      to_name: p.holderName, to_email: p.email,
      ranch_name: p.ranchName, permit_number: p.permitNumber,
      permit_link: makeLink(p), expires_date: fmtDate(p.expiresDate),
    }, EJ_PUBLIC_KEY);
    toast(`Permit emailed to ${p.email}`);
  } catch(e) { toast(`Send failed: ${e.text || e.message || 'unknown error'}`); }
}

async function sendWaiverEmail(id) {
  const p = db.find(id); if (!p || !p.email) return;
  if (!ejReady()) { toast('Configure EmailJS first — see Legal Forms tab'); return; }
  try {
    await emailjs.send(EJ_SERVICE_ID, EJ_WAIVER_TPL, {
      to_name: p.holderName, to_email: p.email,
      ranch_name: p.ranchName, waiver_link: makeWaiverLink(p),
    }, EJ_PUBLIC_KEY);
    await firestore.collection(COLL).doc(p.id).set({ waiverSentAt: new Date().toISOString() }, { merge: true });
    toast(`Waiver sent to ${p.email}`);
  } catch(e) { toast(`Send failed: ${e.text || e.message || 'unknown error'}`); }
}

async function sendAllWaivers() {
  const waiverMap = {}; S.waivers.forEach(w => { waiverMap[w.permitId] = w; });
  const unsent = db.all().filter(p => p.email && !p.waiverSentAt && !waiverMap[p.id]?.signedAt);
  if (!unsent.length) return;
  let sent = 0;
  for (const p of unsent) {
    try {
      await emailjs.send(EJ_SERVICE_ID, EJ_WAIVER_TPL, {
        to_name: p.holderName, to_email: p.email,
        ranch_name: p.ranchName, waiver_link: makeWaiverLink(p),
      }, EJ_PUBLIC_KEY);
      await firestore.collection(COLL).doc(p.id).set({ waiverSentAt: new Date().toISOString() }, { merge: true });
      sent++;
    } catch(e) { console.error('Waiver send failed for', p.holderName, e); }
  }
  toast(`${sent} waiver${sent!==1?'s':''} sent`);
}

// ─── Signature pad ─────────────────────────────────────────
function initSignaturePad(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return null;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#1C2D1C'; ctx.lineWidth = 2.5;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let drawing = false, lx = 0, ly = 0;
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches?.[0];
    return { x: (t?.clientX ?? e.clientX) - r.left, y: (t?.clientY ?? e.clientY) - r.top };
  }
  canvas.addEventListener('mousedown', e => { drawing = true; const p = pos(e); lx=p.x; ly=p.y; });
  canvas.addEventListener('mousemove', e => { if (!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke(); lx=p.x; ly=p.y; });
  canvas.addEventListener('mouseup', () => drawing=false);
  canvas.addEventListener('mouseleave', () => drawing=false);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing=true; const p=pos(e); lx=p.x; ly=p.y; }, {passive:false});
  canvas.addEventListener('touchmove',  e => { e.preventDefault(); if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke(); lx=p.x; ly=p.y; }, {passive:false});
  canvas.addEventListener('touchend', () => drawing=false);
  return {
    clear: () => ctx.clearRect(0, 0, rect.width, rect.height),
    isEmpty: () => { const d=ctx.getImageData(0,0,canvas.width,canvas.height).data; for(let i=3;i<d.length;i+=4){if(d[i]>10)return false;} return true; },
    toDataURL: () => canvas.toDataURL('image/png'),
  };
}

async function submitWaiver(encodedPermit) {
  const p = decode(encodedPermit); if (!p) return;
  const name    = document.getElementById('w-name')?.value.trim();
  const address = document.getElementById('w-address')?.value.trim();
  if (!name)    { toast('Please enter your printed name'); return; }
  if (!address) { toast('Please enter your address'); return; }
  if (sigPads.main?.isEmpty())  { toast('Please sign the release form'); return; }
  if (sigPads.terms?.isEmpty()) { toast('Please sign the terms agreement'); return; }
  const btn = document.querySelector('button[onclick^="submitWaiver"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }
  try {
    const now = new Date().toISOString();
    await firestore.collection(WAIVER_COLL).doc(p.id).set({
      permitId: p.id, holderName: p.holderName, email: p.email || '',
      ranchName: p.ranchName, permitNumber: p.permitNumber,
      signedAt: now, printedName: name, address,
      signature: sigPads.main.toDataURL(),
      termsSignature: sigPads.terms.toDataURL(), termsSignedAt: now,
    });
    await firestore.collection(COLL).doc(p.id).set({ waiverSignedAt: now }, { merge: true });
    // Auto-send permit link to hunter now that waiver is signed
    if (ejReady() && p.email) {
      try {
        await emailjs.send(EJ_SERVICE_ID, EJ_PERMIT_TPL, {
          to_name: p.holderName, to_email: p.email,
          ranch_name: p.ranchName, permit_number: p.permitNumber,
          permit_link: makeLink(p), expires_date: fmtDate(p.expiresDate),
        }, EJ_PUBLIC_KEY);
      } catch(e) { console.error('Permit email failed after waiver sign:', e); }
    }
    waiverState.inProgress = false;
    waiverState.submitted  = true;
    renderWaiverSuccess(p);
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Submit Signed Waiver'; }
    toast('Submission failed — please try again');
  }
}

// ─── Actions ──────────────────────────────────────────────
function setTab(t) {
  S.tab = t;
  if (t === 'new' && !S.editId) S.f = freshForm();
  renderAdmin();
}

function addCoord() {
  S.f.coords.push({ lat:'', lng:'', label:'' });
  renderAdmin();
  requestAnimationFrame(() => {
    const inputs = document.querySelectorAll('.coord-card input');
    if (inputs.length) inputs[inputs.length - 3]?.focus();
  });
}

function rmCoord(i) { S.f.coords.splice(i,1); renderAdmin(); }
function updCoord(i,f,v) { S.f.coords[i][f] = v; }

function syncFromDOM() {
  const g = id => document.getElementById(id)?.value ?? '';
  S.f.ranchName = g('fi-ranch'); S.f.permitNumber = g('fi-num');
  S.f.holderName = g('fi-holder'); S.f.email = g('fi-email');
  S.f.issueDate = g('fi-issue'); S.f.expiresDate = g('fi-exp');
  S.f.species = g('fi-species');
}

async function submitForm() {
  syncFromDOM();
  const f = S.f;
  if (!f.ranchName.trim()) { toast('Ranch name is required'); return; }
  if (!f.holderName.trim()) { toast('Permit holder name is required'); return; }
  if (!f.expiresDate) { toast('Expiration date is required'); return; }

  const prev = S.editId ? db.find(S.editId) : null;
  const permit = {
    id: S.editId || crypto.randomUUID(),
    permitNumber: f.permitNumber.trim() || nextNum(),
    ranchName: f.ranchName.trim(),
    holderName: f.holderName.trim(),
    email: (f.email || '').trim(),
    issueDate: f.issueDate,
    expiresDate: f.expiresDate,
    species: f.species.trim(),
    coords: f.coords.filter(c => c.lat.trim() || c.lng.trim()),
    deactivated: false,
    createdAt: prev?.createdAt || new Date().toISOString(),
  };

  await db.upsert(permit);
  copyText(makeLink(permit), S.editId ? 'Updated link copied — resend to customer' : 'Permit link copied to clipboard!');
  S.editId = null; S.f = freshForm(); S.tab = 'issued';
  renderAdmin();
}

function clearForm() { S.editId = null; S.f = freshForm(); renderAdmin(); }
function cancelEdit() { S.editId = null; S.f = freshForm(); renderAdmin(); }

function doEdit(id) {
  const p = db.find(id); if (!p) return;
  S.editId = id;
  S.f = {
    ranchName: p.ranchName, permitNumber: p.permitNumber,
    holderName: p.holderName, email: p.email || '', issueDate: p.issueDate,
    expiresDate: p.expiresDate, species: p.species || '',
    coords: (p.coords||p.coordinates||[]).length ? [...(p.coords||p.coordinates)] : [{lat:'',lng:'',label:''}],
  };
  S.tab = 'new'; renderAdmin();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function doCopy(id) {
  const p = db.find(id); if (!p) return;
  copyText(makeLink(p));
}

function doPreview(id) {
  const p = db.find(id); if (!p) return;
  S.viewerPermit = p; S.tab = 'viewer'; renderAdmin();
}

async function doRevoke(id) {
  const p = db.find(id); if (!p) return;
  p.deactivated = !p.deactivated; await db.upsert(p);
  copyText(makeLink(p), p.deactivated
    ? `Permit ${p.permitNumber} revoked — resend the updated link to the customer`
    : `Permit ${p.permitNumber} reactivated — resend the updated link to the customer`);
  renderAdmin();
}

async function doDelete(id) {
  const p = db.find(id); if (!p) return;
  if (confirm(`Delete permit ${p.permitNumber} for ${p.holderName}?\n\nThis cannot be undone.`)) {
    await db.del(id); toast('Permit deleted'); renderAdmin();
  }
}
